<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIO - ZOODOM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#" aria-label="Inicio"><img src="img/logo_zoodom.png" alt="Logo ZOODOM"></a>
        <div class="header-icons">
            <button class="lang-toggle" id="lang-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Cambiar idioma">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="lang-icon" aria-hidden="true" focusable="false">
                    <path d="M192 64C209.7 64 224 78.3 224 96L224 128L352 128C369.7 128 384 142.3 384 160C384 177.7 369.7 192 352 192L342.4 192L334 215.1C317.6 260.3 292.9 301.6 261.8 337.1C276 345.9 290.8 353.7 306.2 360.6L356.6 383L418.8 243C423.9 231.4 435.4 224 448 224C460.6 224 472.1 231.4 477.2 243L605.2 531C612.4 547.2 605.1 566.1 589 573.2C572.9 580.3 553.9 573.1 546.8 557L526.8 512L369.3 512L349.3 557C342.1 573.2 323.2 580.4 307.1 573.2C291 566 283.7 547.1 290.9 531L330.7 441.5L280.3 419.1C257.3 408.9 235.3 396.7 214.5 382.7C193.2 399.9 169.9 414.9 145 427.4L110.3 444.6C94.5 452.5 75.3 446.1 67.4 430.3C59.5 414.5 65.9 395.3 81.7 387.4L116.2 370.1C132.5 361.9 148 352.4 162.6 341.8C148.8 329.1 135.8 315.4 123.7 300.9L113.6 288.7C102.3 275.1 104.1 254.9 117.7 243.6C131.3 232.3 151.5 234.1 162.8 247.7L173 259.9C184.5 273.8 197.1 286.7 210.4 298.6C237.9 268.2 259.6 232.5 273.9 193.2L274.4 192L64.1 192C46.3 192 32 177.7 32 160C32 142.3 46.3 128 64 128L160 128L160 96C160 78.3 174.3 64 192 64zM448 334.8L397.7 448L498.3 448L448 334.8z"/>
                </svg>
            </button>

            <div class="lang-menu" id="lang-menu" role="menu" aria-hidden="true">
                <ul>
                    <li class="lang-item" data-lang="es" role="menuitem"><img class="flag-img" src="img/flag_es.png" alt="ES"><span class="label">Español</span></li>
                    <li class="lang-item" data-lang="en" role="menuitem"><img class="flag-img" src="img/flag_us.png" alt="EN"><span class="label">English</span></li>
                    <li class="lang-item" data-lang="pt" role="menuitem"><img class="flag-img" src="img/flag_br.png" alt="PT"><span class="label">Português</span></li>
                    <li class="lang-item" data-lang="fr" role="menuitem"><img class="flag-img" src="img/flag_fr.png" alt="FR"><span class="label">France</span></li>
                    <li class="lang-item" data-lang="it" role="menuitem"><img class="flag-img" src="img/flag_it.png" alt="IT"><span class="label">Italy</span></li>
                    <li class="lang-item" data-lang="ru" role="menuitem"><img class="flag-img" src="img/flag_ru.png" alt="RU"><span class="label">Русский</span></li>
                    <li class="lang-item" data-lang="zh" role="menuitem"><img class="flag-img" src="img/flag_cn.png" alt="ZH"><span class="label">中文</span></li>
                </ul>
            </div>
        </div>
    </header>

    <section class="hero-carousel">
        <h1 class="carousel-title">Tigre</h1>
        <div class="carousel">
            <button class="arrow prev" aria-label="Anterior" type="button">
                <i class="fa-solid fa-arrow-left icon-fa" aria-hidden="true"></i>
            </button>
            <div class="slides">
                <div class="slide active">
                    <img src="img/tigre_img.png" alt="Tigre">
                </div>
                <div class="slide">
                    <img src="img/zebra_img.png" alt="Cebra">
                </div>
                <div class="slide">
                    <img src="img/leon_img.png" alt="León">
                </div>
                <div class="slide">
                    <img src="img/hipopotamo_img.png" alt="Hipopótamo">
                </div>
                <div class="slide">
                    <img src="img/mono_img.png" alt="Mono">
                </div>
            </div>
            <button class="arrow next" aria-label="Siguiente" type="button">
                <i class="fa-solid fa-arrow-right icon-fa" aria-hidden="true"></i>
            </button>    
        </div>

        <div class="carousel-controls">
            <button class="info-button">Informacion</button>
            <div class="dots" role="tablist" aria-label="Paginación del carrusel">
                <button class="dot active" data-index="0" aria-label="Slide 1"></button>
                <button class="dot" data-index="1" aria-label="Slide 2"></button>
                <button class="dot" data-index="2" aria-label="Slide 3"></button>
                <button class="dot" data-index="3" aria-label="Slide 4"></button>
                <button class="dot" data-index="4" aria-label="Slide 5"></button>
            </div>
        </div> 
    </section>

    <div id="animal-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-content" role="document">
            <button class="modal-close" aria-label="Cerrar">&times;</button>
            <div class="modal-body">
                <div class="modal-left">
                    <img id="modal-img" src="img/tigre_caja.png" alt="Tigre (placeholder)">
                </div>
                <div class="modal-right">
                    <h2 id="modal-title">Tigre</h2>
                    <div class="modal-stats">
                        <div class="stat"><strong id="modal-age">15 yr</strong><span>Edad</span></div>
                        <div class="stat"><strong id="modal-size">70 cm</strong><span>Tamaño</span></div>
                        <div class="stat"><strong id="modal-range">96 km</strong><span>Rango</span></div>
                    </div>
                    <p id="modal-desc">Descripción del animal.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/carousel.js"></script> 

</body> 
</html>
